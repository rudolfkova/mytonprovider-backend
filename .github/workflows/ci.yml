name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            agent/go.sum
            coordinator/go.sum
            contracts/go.sum

      - name: Install protoc and Task
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify generated proto
        run: task proto:check

      - name: Unit tests
        run: |
          go test ./coordinator/internal/workers/providersMaster/... -count=1
          go test ./coordinator/internal/clients/ifconfig/... -count=1

      - name: Build agent and coordinator
        run: |
          go build -o /dev/null ./agent/cmd/agent
          go build -o /dev/null ./coordinator/cmd
          go build -o /dev/null ./coordinator/cmd/dump-runchecks
